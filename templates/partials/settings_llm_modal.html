{# partials/settings_llm_modal.html — Portal LLM 配置 modal

依赖：form（dict: provider/base_url/model/api_key）
      providers（list[dict: name, base_url, models]）

测试/保存都走 fetch + JSON，不重渲 modal（保留 api_key 输入框、避免动画重跑）。
成功/失败反馈直接做在按钮样式和小红字上。
#}
<style>
/* modal 自包含样式（从 portal.css 抄，HTMX partial 理念：include 到任何模板都能正常弹窗） */
.modal-mask{position:fixed;inset:0;z-index:50;background:rgba(28,43,65,.32);backdrop-filter:blur(6px) saturate(120%);-webkit-backdrop-filter:blur(6px) saturate(120%);display:grid;place-items:center;padding:20px;animation:fade-in .18s ease-out;}
.modal-card{width:520px;max-width:calc(100vw - 40px);background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.78));border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 18px 50px rgba(40,60,90,.18),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);overflow:hidden;animation:palette-in .22s cubic-bezier(.2,.8,.2,1);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid rgba(60,60,67,.08);}
.modal-title-text b{font-size:15px;font-weight:650;letter-spacing:-.2px;display:block;color:#1d1d1f}
.modal-close{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:20px;color:#69707a;cursor:pointer;background:transparent;border:0;transition:.18s;}
.modal-close:hover{background:rgba(60,60,67,.06);color:#1d1d1f}
.modal-body{padding:18px 22px 20px}
.modal-body label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.modal-body label>span{font-size:12.5px;color:#3f4854;font-weight:500}
.modal-body input,.modal-body select{padding:9px 12px;border-radius:10px;font-size:13.5px;border:1px solid rgba(60,60,67,.14);color:#1d1d1f;background:#fff;font-family:inherit;outline:none;width:100%;box-sizing:border-box;}
.modal-body input:focus,.modal-body select:focus{border-color:#0a6ee8;box-shadow:0 0 0 3px rgba(10,110,232,.10);}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:8px}
.btn-primary{padding:9px 18px;border-radius:10px;border:0;cursor:pointer;font-size:13.5px;font-weight:600;background:#0a6ee8;color:#fff;}
.btn-primary:hover{background:#0859bf}
.btn-secondary{padding:9px 18px;border-radius:10px;border:1px solid rgba(60,60,67,.14);cursor:pointer;font-size:13.5px;font-weight:500;background:#fff;color:#1d1d1f;}
.btn-secondary:hover{color:#0a6ee8;border-color:rgba(10,110,232,.25)}
/* 测试按钮状态（不重渲 modal，原地变色） */
#llm-test-btn{min-width:96px;text-align:center;transition:.18s}
.btn-test-ok{background:rgba(45,181,128,.1)!important;color:#1e7a4d!important;border-color:rgba(45,181,128,.25)!important;cursor:default;}
.btn-test-ok:hover{color:#1e7a4d!important;border-color:rgba(45,181,128,.25)!important;}
.btn-test-fail{color:#b12930!important;border-color:rgba(230,82,92,.3)!important;}
.btn-test-fail:hover{color:#b12930!important;border-color:rgba(230,82,92,.3)!important;}
.btn-test-busy{color:#69707a!important;border-color:rgba(60,60,67,.14)!important;cursor:wait;}
/* 应用配置错误提示：默认隐藏（:empty），有内容时显示，不占空间 */
.llm-save-msg{font-size:12px;color:#b12930;margin:-4px 0 8px;line-height:1.4;white-space:pre-wrap}
.llm-save-msg:empty{display:none}
@keyframes palette-in{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
</style>
<div class="modal-mask" onclick="if(event.target===this) document.getElementById('settings-modal-slot').innerHTML=''">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title-text">
        <b>LLM 配置</b>
      </span>
      <span class="modal-close"
            onclick="document.getElementById('settings-modal-slot').innerHTML=''">&times;</span>
    </div>

    <div class="modal-body">

    <form id="llm-form">
      <label>
        <span>Provider</span>
        <select name="provider" id="llm-provider" onchange="onProviderChange()">
          <option value="">— 选择 —</option>
          {% for p in providers %}
          <option value="{{ p.name }}"
                  data-base-url="{{ p.base_url }}"
                  data-models='{{ p.models | tojson }}'
                  {% if form.provider == p.name %}selected{% endif %}>
            {{ p.name }}
          </option>
          {% endfor %}
          <option value="custom" {% if form.provider == 'custom' %}selected{% endif %}>自定义…</option>
        </select>
      </label>

      <label>
        <span>Base URL</span>
        <input type="text" name="base_url" id="llm-base-url"
               value="{{ form.base_url or '' }}"
               placeholder="https://... 或留空用默认" />
      </label>

      <label>
        <span>Model</span>
        <input type="text" name="model" id="llm-model"
               list="llm-models-list"
               value="{{ form.model or '' }}"
               placeholder="mcd-llm-v1 / gpt-4o-mini" />
        <datalist id="llm-models-list"></datalist>
      </label>

      <label>
        <span>API Key</span>
        <input type="password" name="api_key" autocomplete="off"
               value="{{ form.api_key or '' }}"
               placeholder="sk-..." />
      </label>

      <div class="llm-save-msg" id="llm-save-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="llm-test-btn" onclick="testLLM()">测试连接</button>
        <button type="button" class="btn-primary" id="llm-save-btn" onclick="saveLLM()">应用配置</button>
      </div>
    </form>

    </div>
  </div>
</div>

<script>
  // provider 切换 → 自动填 base_url + 刷新 model datalist
  // 注意：只在用户主动改 select 时才覆盖 base_url，
  // HTMX swap 后不要调用，避免冲掉用户手填的 base_url
  function onProviderChange() {
    const sel = document.getElementById('llm-provider');
    if (!sel) return;
    const opt = sel.options[sel.selectedIndex];
    const baseUrlInput = document.getElementById('llm-base-url');
    const modelInput = document.getElementById('llm-model');
    const datalist = document.getElementById('llm-models-list');
    if (!baseUrlInput || !datalist) return;
    if (opt && opt.value === 'custom') {
      baseUrlInput.readOnly = false;
      datalist.innerHTML = '';
    } else if (opt && opt.value) {
      baseUrlInput.value = opt.getAttribute('data-base-url') || '';
      baseUrlInput.readOnly = true;
      const models = JSON.parse(opt.getAttribute('data-models') || '[]');
      datalist.innerHTML = models.map(m => `<option value="${m}">`).join('');
      // 切 provider 时清空 model：避免旧 provider 的 model 留到新 provider 下报错
      // 单 model provider 顺便自动填第一个（用户不用手选）
      if (modelInput) {
        if (models.length === 1) {
          modelInput.value = models[0];
        } else {
          modelInput.value = '';
        }
      }
    }
  }
  // 初次加载：若已选 provider，刷新 model datalist（不动 base_url，已有值保留）
  (function initDatalist() {
    const sel = document.getElementById('llm-provider');
    if (!sel) return;
    const opt = sel.options[sel.selectedIndex];
    const datalist = document.getElementById('llm-models-list');
    if (opt && opt.value && opt.value !== 'custom' && datalist) {
      const models = JSON.parse(opt.getAttribute('data-models') || '[]');
      datalist.innerHTML = models.map(m => `<option value="${m}">`).join('');
    }
  })();

  // 测试连接：fetch + JSON，不重渲 modal（保留 api_key 输入框，避免动画重跑）
  async function testLLM() {
    const btn = document.getElementById('llm-test-btn');
    if (!btn) return;
    const form = document.getElementById('llm-form');
    if (!form) return;

    // 重置状态
    btn.classList.remove('btn-test-ok', 'btn-test-fail', 'btn-test-busy');
    btn.removeAttribute('title');
    btn.textContent = '测试中…';
    btn.classList.add('btn-test-busy');
    btn.disabled = true;

    try {
      const resp = await fetch('/api/settings/llm/test', {
        method: 'POST',
        body: new FormData(form),
      });
      const data = await resp.json();
      btn.classList.remove('btn-test-busy');
      if (data.ok) {
        btn.textContent = '✓ 连接成功';
        btn.classList.add('btn-test-ok');
      } else {
        btn.textContent = '测试失败';
        btn.classList.add('btn-test-fail');
        btn.disabled = false;
      }
    } catch (e) {
      btn.classList.remove('btn-test-busy');
      btn.textContent = '测试失败';
      btn.classList.add('btn-test-fail');
      btn.disabled = false;
    }
  }

  // 应用配置：fetch + JSON，成功关 modal，失败显示在 form 里的小红字（不重渲）
  async function saveLLM() {
    const btn = document.getElementById('llm-save-btn');
    if (!btn) return;
    const form = document.getElementById('llm-form');
    if (!form) return;
    const msg = document.getElementById('llm-save-msg');
    if (msg) msg.textContent = '';

    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = '保存中…';

    try {
      const resp = await fetch('/api/settings/llm', {
        method: 'POST',
        body: new FormData(form),
      });
      const data = await resp.json();
      if (data.ok) {
        // 直接关 modal
        const slot = document.getElementById('settings-modal-slot');
        if (slot) slot.innerHTML = '';
      } else {
        btn.textContent = orig;
        btn.disabled = false;
        if (msg) msg.textContent = data.detail || '保存失败';
      }
    } catch (e) {
      btn.textContent = orig;
      btn.disabled = false;
      if (msg) msg.textContent = '网络错误：' + e.message;
    }
  }
</script>
