{# partials/04_owner.html — Tab 7: Owner 对比 #}

<form method="get" hx-get="/api/insights/tab" hx-target="#ins-tab-block" hx-swap="outerHTML" class="form-grid form-grid-tri">
  <input type="hidden" name="tab" value="owner" />
  <div class="form-row">
    <label>最少 plan 数</label>
    <select name="oc_min_plans">
      {% for v in [1,2,3,5,10,20,50] %}
      <option value="{{ v }}" {% if params.oc_min_plans|string == v|string %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-row">
    <label>最少触达</label>
    <select name="oc_min_reach">
      {% for v in [100,500,1000,3000,10000,50000,100000] %}
      <option value="{{ v }}" {% if params.oc_min_reach|string == v|string %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-row">
    <button type="submit" class="btn btn-dark btn-sm">查询</button>
  </div>
</form>

{% if not df_rows %}
<div class="warning-banner">无有效 owner 数据</div>
{% else %}
<div class="batch-wrap">
<table class="batch-table">
  <thead><tr>{% for c in columns %}<th>{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>{% for r in df_rows %}<tr>{% for c in columns %}<td>{{ r[c] }}</td>{% endfor %}</tr>{% endfor %}</tbody>
</table>
</div>
{% endif %}
