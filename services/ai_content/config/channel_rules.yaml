# -*- coding: utf-8 -*-
# channel_rules.yaml — 各渠道字数 / 结构规则
# PRD §11.4 硬规则：渠道字数必须由程序判断，不依赖 LLM
# PRD §26 第 5 项"渠道标题和正文字数上限"待业务确认 → 当前采用行业默认
# 后续业务确认时改 YAML 不改代码

version: "1.0"

# ── 字数上限 ──
# title_max / body_max 含中文字符（含 emoji 算 1 字）
# 微信/短信行业经验值；APP Push 沿用 PRD §7.3 "≤15 字优先" 的口径
channels:
  APP Push:
    title_max: 15
    body_max: 60
    require_title: true
    emoji_max: 2              # APP Push 业界约定 ≤2 个
    notes: "标题≤15 字优先、含数字/emoji/紧迫词、明确利益点"

  企微1v1:
    title_max: 0              # 企微1v1 无独立标题
    body_max: 200
    require_title: false
    emoji_max: 3
    notes: "正文≤200 字阅读门槛、emoji 1-3 个、有优惠/动作号召"

  短信:
    title_max: 0
    body_max: 70              # 单条短信 70 字上限（行业）
    require_title: false
    emoji_max: 0              # 短信不支持 emoji
    notes: "70 字单条；超长分条"

  微信小程序订阅消息:
    title_max: 20             # 订阅消息标题上限（微信官方）
    body_max: 45              # 订阅消息正文上限（行业）
    require_title: true
    emoji_max: 2
    notes: "标题≤20字/正文≤45字；订阅消息用户主动授权才送达，利益点要前置"
