# -*- coding: utf-8 -*-
# config/coupon_keywords.yaml — 标题/正文带券词判断词典（Phase 12 #11）
#
# 用法：
#   from core.text_classifier import classify_coupon_in_text
#   result = classify_coupon_in_text(title="新品9.9元起优惠券", body="点击领券")
#
# 词典分类：
#   - 折扣词：明确的折扣表达（数字+折/减/特价 等）
#   - 优惠词：优惠券/代金券 等带"券"字的强信号
#   - 链接词：mcd.cc/mcdcn 等点击跳转
#
# 注意：
#   - 匹配用正则，"是" = 任一关键词命中；"否" = 全部未命中
#   - 这里**不**判断 form 字段"实际是否用券"（plan 维度），只判断文案粒度
#   - 关键词库按 CNN历史备份0827 实测 Top 关键词迭代（详见 tools/clean_cnn_backup.py
#     验证报告）

version: v1.0
last_updated: 2026-08-27

# 折扣词：数字 + 折 / 减 / 元（注意：\d+元 太宽，'50元' 是定价不是券，不放）
discount:
  - "9\\.9"
  - "\\d+折"
  - "立减\\d+"
  - "满\\d+减\\d+"
  - "限时"
  - "特价"

# 优惠词：强"券"信号
coupon:
  - "优惠券"
  - "代金券"
  - "折扣券"
  - "红包"
  - "满减"
  - "立减"
  - "优惠"
  - "领券"
  - "福利"
  - "补贴"

# 链接词：暗示"点击领取"
link:
  - "mcd\\.cc"
  - "mcdcn"
  - ">>>"
  - ">>"
  - "点击"
