# -*- coding: utf-8 -*-
# config/product_benefit.yaml — 产品类别 + 权益类型 枚举（Phase A.1 · 2026-08-28）
#
# 用法：
#   from core.product_benefit_loader import load_product_benefit
#   cfg = load_product_benefit()
#   PRODUCT_CATEGORIES = cfg["product_categories"]
#   BENEFIT_TYPES = cfg["benefit_types"]
#
# 设计（按 Phase 9 决策文档）：
#   - 产品类别：10 个（覆盖麦当劳主推品类）
#   - 权益类型：8 个（折扣/满减/赠品/会员/限时/新品/活动/其他）
#   - 都支持「自定义输入」兜底：UI selectbox 提供"自定义"选项 + 文本框
#
# 关键约束（不动 baseline）：
#   - 这两个字段**不参与 CTR baseline 估算**（Phase 9 拍板：直接 baseline 数据稀疏）
#   - 仅影响：①AI 文案生成（prompt 注入）②产品词典 jieba 词条扩展
#   - 产品词典按用户在 data/custom_dict.txt 维护，本文件只枚举"大类"
#
# ⚠️ 双源同步：本文件枚举 与 core/product_benefit.py:FALLBACK_PRODUCT_CATEGORIES /
# FALLBACK_BENEFIT_TYPES 保持同步（后者仅在 yaml 缺失/解析失败时兜底用）
#
# 注意：
#   - jieba 词典与 yaml 枚举解耦并行：jieba = 内容运营维护单品词典
#     （如"麦辣鸡腿堡"），yaml = 产品经理维护业务大类
#     （如"汉堡"）—— 两条线各自演化

version: v1.0
last_updated: 2026-08-28

# 产品类别：覆盖麦当劳主推品类（与菜单部门对齐）
product_categories:
  - 汉堡
  - 小食
  - 饮料
  - 全餐
  - 早餐
  - 甜品
  - 咖啡
  - 麦满分
  - 儿童餐
  - 限定

# 权益类型：覆盖主要促销手法
benefit_types:
  - 折扣
  - 满减
  - 赠品
  - 会员专享
  - 限时优惠
  - 新品首发
  - 活动促销
  - 其他

# "自定义"选项的固定文本（前端 selectbox 选项 + 提示用户可自由输入）
custom_label: 自定义
